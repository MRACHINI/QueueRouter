{% extends "base.html" %}
{% block title %}Usage{% endblock %}
{% block main_class %}container dense-page{% endblock %}
{% block content %}
<div class="row between wrap">
  <h1>Usage</h1>
  <form method="get" action="/admin/usage" class="row wrap" id="usage-filters">
    <span class="live-status" id="usage-status" role="status"></span>
    <select name="range" aria-label="Period">
      {% for key, label in choices.items() %}<option value="{{ key }}" {% if key == period.choice %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
    <span class="row wrap" id="usage-custom" {% if period.choice != "custom" %}hidden{% endif %}>
      <input type="date" name="from" value="{{ period.first }}" aria-label="First day (UTC)">
      <select name="from_hour" aria-label="From (UTC)">
        {% for h in range(24) %}<option value="{{ h }}" {% if h == period.first_hour %}selected{% endif %}>{{ "%02d:00" | format(h) }}</option>{% endfor %}
      </select>
      <span class="small muted">to</span>
      <input type="date" name="to" value="{{ period.last }}" aria-label="Last day (UTC)">
      <select name="to_hour" aria-label="Until (UTC)">
        {% for h in range(1, 25) %}<option value="{{ h }}" {% if h == period.last_hour %}selected{% endif %}>{{ "%02d:00" | format(h) }}</option>{% endfor %}
      </select>
      <span class="small muted">UTC</span>
    </span>
    <input type="hidden" name="group" value="{{ "range" if merged else "" }}">
    <noscript><button type="submit" class="secondary">Show</button></noscript>
    <a id="usage-csv" href="{{ links.csv }}">CSV</a>
    <a id="usage-csv-models" href="{{ links.csv_models }}" title="A row per model of each client">CSV per model</a>
  </form>
</div>

<div id="usage-live" data-stream="/admin/api/live?view=brief" data-body="/admin/usage/body">
{% include "usage_body.html" %}
</div>
{% endblock %}
