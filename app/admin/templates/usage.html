{% extends "base.html" %}
{% block title %}Usage{% endblock %}
{% block main_class %}container dense-page{% endblock %}
{% block content %}
<div class="row between wrap">
  <h1>Usage</h1>
  <form method="get" action="/admin/usage" class="row wrap" id="usage-filters">
    <span class="live-status" id="usage-status" role="status"></span>
    <input type="hidden" name="model_days" value="{{ model_days }}">
    <select name="days" aria-label="Period">
      {% for d in (1, 7, 30, 90, 365) %}<option value="{{ d }}" {% if d == days %}selected{% endif %}>last {{ d }} day{{ "s" if d > 1 }}</option>{% endfor %}
    </select>
    <select name="by" aria-label="Group">
      <option value="">by client</option>
      <option value="model" {% if by_model %}selected{% endif %}>by client and model</option>
    </select>
    <noscript><button type="submit" class="secondary">Show</button></noscript>
    <a id="usage-csv" href="/admin/usage.csv?days={{ days }}{% if by_model %}&amp;by=model{% endif %}">CSV</a>
  </form>
</div>

<div id="usage-live" data-stream="/admin/api/live?view=brief" data-body="/admin/usage/body">
{% include "usage_body.html" %}
</div>
{% endblock %}
