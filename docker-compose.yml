# Default deployment: behind an existing Traefik (v2 or v3) using Docker labels. Traefik reaches QueueRouter through
# "gate", a small Caddy that isn't updated with it: new requests wait there while QueueRouter restarts.
# No Traefik? Use docker-compose.caddy.yml instead.
services:
  queuerouter:
    image: ghcr.io/mrachini/queuerouter:${QUEUEROUTER_TAG:-latest}
    env_file: .env
    expose: ["8000"]          # no host port: reachable only through Traefik
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - qr_data:/data         # database, secret key, backups: back this up
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]   # only used at start to fix /data ownership, then dropped
    # environment: PUID / PGID = owner of /data (default 10001)
    stop_grace_period: 11m    # a redeploy lets running requests finish (QueueRouter gives them 10 minutes)
    deploy:
      replicas: 1             # never scale: the queue lives in memory
      resources:
        limits: { cpus: "1", memory: 512M }   # less CPU stretches every start (loading the code is CPU work)
    networks: [traefik]
    labels:
      - traefik.enable=false  # Traefik talks to the gate

  gate:
    image: caddy:2.11.7-alpine  # a fixed version: updating this one is what would cut requests
    command: [caddy, run, --config, /etc/caddy/gate.caddyfile, --adapter, caddyfile]
    configs:
      - source: gate
        target: /etc/caddy/gate.caddyfile
    environment:
      XDG_CONFIG_HOME: /tmp
      XDG_DATA_HOME: /tmp
    expose: ["8000"]
    restart: unless-stopped
    user: "10001:10001"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]  # the Caddy binary carries it and won't start without
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256M }
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.queuerouter.rule=Host(`${DOMAIN:?set DOMAIN in .env}`)
      - traefik.http.routers.queuerouter.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.queuerouter.tls=true
      - traefik.http.routers.queuerouter.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.queuerouter.loadbalancer.server.port=8000
      # Don't add compress/buffering middlewares to this router: they break streaming.

configs:
  gate:
    content: |
      {
        admin off
        auto_https off
        persist_config off
        servers {
          trusted_proxies static private_ranges  # keeps the address Traefik passes on
        }
      }
      :8000 {
        reverse_proxy queuerouter:8000 {
          flush_interval -1          # streams and keep-alives go out at once
          lb_try_duration 5m         # how long a new request may wait for QueueRouter
          lb_try_interval 500ms
          request_buffers 25MiB      # the body waits here, not half sent through Traefik
          transport http {
            keepalive off            # a closing QueueRouter can't be handed a new request
          }
        }
      }

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true

volumes:
  qr_data:
